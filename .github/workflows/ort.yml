name: ort

on:
  workflow_dispatch:
    inputs:
      variants:
        description: 'JSON array de variantes'
        required: true
        default: '["cpu","cuda","intel","amd"]'

concurrency:
  group: b3l0w-ort-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  base:
    name: base-${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variants) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build base
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: docker/base.Dockerfile
          target: base-${{ matrix.variant }}
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ghcr.io/below-z3r0/b3l0w-ort:${{ matrix.variant }}-1.31
          cache-from: type=registry,ref=ghcr.io/below-z3r0/b3l0w-ort:buildcache-${{ matrix.variant }}
          cache-to: type=registry,ref=ghcr.io/below-z3r0/b3l0w-ort:buildcache-${{ matrix.variant }},mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/Below-Z3R0/b3l0w-ort
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Smoke test the runtime
        run: |
          docker run --rm --entrypoint sh \
            ghcr.io/below-z3r0/b3l0w-ort:${{ matrix.variant }}-1.31 \
            -c 'test -f /usr/local/lib/libonnxruntime.so && ldconfig -p | grep -q onnxruntime'
